<div class="flex flex-wrap gap-4 justify-center">
  @for (plant of plants$ | async; track plant.id) {
    <mat-card
      class="example-card p-2 m-4 w-80 mat-elevation-z4"
      appearance="outlined"
    >
      <mat-card-header>
        <mat-card-title>{{ plant.name }}</mat-card-title>
        <mat-card-subtitle>{{ plant.latinName }}</mat-card-subtitle>
      </mat-card-header>
      <img mat-card-image [src]="plant.imageUrl" [alt]="plant.name" />
      <mat-card-content>
        <p>
          {{ plant.description }}
        </p>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button color="primary" [routerLink]="['./', plant.id]"
          >Details</a
        >
      </mat-card-actions>
    </mat-card>
  }
</div>
