<div class="flex flex-wrap gap-4 justify-center">
  @for (plant of plants$ | async; track plant.id) {
    <mat-card
      class="example-card p-2 m-4 w-80 mat-elevation-z4"
      appearance="outlined"
    >
      <mat-card-header>
        <div mat-card-avatar class="text-center font-bold">
          {{ getPfennigNumber(plant.pfennigNumber) }}
        </div>
        <mat-card-title>{{ plant.name }}</mat-card-title>
        <mat-card-subtitle class="italic">{{
          plant.nameGiver
        }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <a [routerLink]="['./', plant.id]">
          <img mat-card-image [src]="plant.imageUrl" [alt]="plant.name" />
        </a>
        <p class="mt-4">
          {{ plant.discoverLocation }}, {{ plant.discoverDate | date: "yyyy" }}
        </p>
      </mat-card-content>
      <mat-card-actions class="h-full">
        <a
          class="w-full self-end"
          mat-button
          color="primary"
          [routerLink]="['./', plant.id]"
          >Details</a
        >
      </mat-card-actions>
    </mat-card>
  }
</div>
